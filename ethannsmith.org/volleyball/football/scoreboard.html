<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>College Football Scorebug</title>

<style>
/* =========================================================
   COLLEGE FOOTBALL SCOREBUG
   1920x1080 TRANSPARENT BROADCAST OVERLAY
   ========================================================= */

html,
body {
    margin: 0;
    padding: 0;

    width: 1920px;
    height: 1080px;

    background: transparent;

    overflow: hidden;

    font-family:
        "Arial Narrow",
        "Roboto Condensed",
        "Helvetica Neue",
        Arial,
        sans-serif;

    color: #ffffff;
}


/* =========================================================
   MAIN SCOREBUG
   ========================================================= */

#scoreboard {
    position: absolute;

    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);

    width: 820px;
    height: 112px;

    z-index: 20;

    filter:
        drop-shadow(
            0 6px 12px rgba(0, 0, 0, 0.45)
        );
}


/* =========================================================
   TEAM ROW
   ========================================================= */

#teamsRow {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 76px;

    display: flex;
    align-items: stretch;

    z-index: 10;
}


/* =========================================================
   HOME TEAM
   ========================================================= */

#homeTeam {
    position: relative;

    width: 340px;
    height: 76px;

    display: flex;
    align-items: center;

    background:
        linear-gradient(
            90deg,
            #ea7511 0%,
            #ea7511 100%
        );

    box-sizing: border-box;

    overflow: visible;

    z-index: 15;
}


/* HOME TEXTURE */

#homeTeam::before {
    content: "";

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            -45deg,
            transparent 0px,
            transparent 13px,
            rgba(255,255,255,0.045) 14px,
            rgba(255,255,255,0.045) 16px
        );

    pointer-events: none;

    z-index: 1;
}


/* HOME HIGHLIGHT */

#homeTeam::after {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 3px;

    background: rgba(255,255,255,0.35);

    z-index: 3;
}


/* =========================================================
   HOME LOGO
   ========================================================= */

#homeTeam .teamLogo {
    position: absolute;

    left: -34px;
    top: -17px;

    width: 94px;
    height: 94px;

    object-fit: contain;

    z-index: 50;

    pointer-events: none;

    transform:
        rotate(-8deg);

    filter:
        drop-shadow(
            0 5px 4px rgba(0,0,0,0.48)
        )
        drop-shadow(
            0 0 1px rgba(255,255,255,0.35)
        );
}


/* =========================================================
   HOME NAME
   ========================================================= */

#homeName {
    position: absolute;

    left: 72px;
    top: 18px;

    z-index: 20;

    font-size: 23px;

    font-weight: 900;

    letter-spacing: 0.3px;

    line-height: 1;

    text-transform: uppercase;

    white-space: nowrap;

    text-shadow:
        0 2px 3px rgba(0,0,0,0.4);
}


/* =========================================================
   HOME SCORE
   ========================================================= */

#homeScore {
    position: absolute;

    right: 13px;
    top: 1px;

    z-index: 20;

    font-family:
        "Arial Black",
        Arial,
        sans-serif;

    font-size: 58px;

    font-weight: 900;

    line-height: 1;

    letter-spacing: -2px;

    color: #ffffff;

    text-shadow:
        0 3px 3px rgba(0,0,0,0.3);
}


/* =========================================================
   CENTER INFORMATION
   ========================================================= */

#infoBox {
    position: relative;

    width: 250px;
    height: 76px;

    display: flex;
    align-items: stretch;

    background:
        linear-gradient(
            180deg,
            #080a0e 0%,
            #020305 100%
        );

    box-sizing: border-box;

    z-index: 30;

    border-right:
        3px solid rgba(0,0,0,0.7);
}


/* =========================================================
   QUARTER
   ========================================================= */

#quarter {
    width: 70px;
    min-width: 70px;

    height: 76px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #ffffff;

    color: #080a0d;

    font-family:
        "Arial Black",
        Arial,
        sans-serif;

    font-size: 18px;

    font-weight: 900;

    line-height: 1;

    box-sizing: border-box;
}


/* =========================================================
   GAME INFORMATION
   ========================================================= */

#gameInfo {
    flex: 1;

    height: 76px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    box-sizing: border-box;
}


/* =========================================================
   DOWN & DISTANCE
   ========================================================= */

#downDist {
    font-family:
        "Arial Black",
        Arial,
        sans-serif;

    font-size: 16px;

    font-weight: 900;

    line-height: 1;

    letter-spacing: 0.5px;

    color: #ffffff;

    text-transform: uppercase;

    white-space: nowrap;

    text-shadow:
        0 2px 3px rgba(0,0,0,0.5);
}


/* =========================================================
   AWAY TEAM
   ========================================================= */

#awayTeam {
    position: relative;

    width: 340px;
    height: 76px;

    display: flex;
    align-items: center;

    background:
        linear-gradient(
            90deg,
            #22272e 0%,
            #171a1f 100%
        );

    box-sizing: border-box;

    overflow: visible;

    z-index: 15;
}


/* AWAY TEXTURE */

#awayTeam::before {
    content: "";

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            45deg,
            transparent 0px,
            transparent 13px,
            rgba(255,255,255,0.035) 14px,
            rgba(255,255,255,0.035) 16px
        );

    pointer-events: none;

    z-index: 1;
}


/* AWAY HIGHLIGHT */

#awayTeam::after {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 3px;

    background: rgba(255,255,255,0.22);

    z-index: 3;
}


/* =========================================================
   AWAY LOGO
   ========================================================= */

#awayTeam .teamLogo {
    position: absolute;

    right: -34px;
    top: -17px;

    width: 94px;
    height: 94px;

    object-fit: contain;

    z-index: 50;

    pointer-events: none;

    transform:
        rotate(8deg);

    filter:
        drop-shadow(
            0 5px 4px rgba(0,0,0,0.48)
        )
        drop-shadow(
            0 0 1px rgba(255,255,255,0.35)
        );
}


/* =========================================================
   AWAY NAME
   ========================================================= */

#awayName {
    position: absolute;

    right: 72px;
    top: 18px;

    z-index: 20;

    font-size: 23px;

    font-weight: 900;

    letter-spacing: 0.3px;

    line-height: 1;

    text-transform: uppercase;

    white-space: nowrap;

    text-shadow:
        0 2px 3px rgba(0,0,0,0.4);
}


/* =========================================================
   AWAY SCORE
   ========================================================= */

#awayScore {
    position: absolute;

    left: 13px;
    top: 1px;

    z-index: 20;

    font-family:
        "Arial Black",
        Arial,
        sans-serif;

    font-size: 58px;

    font-weight: 900;

    line-height: 1;

    letter-spacing: -2px;

    color: #ffffff;

    text-shadow:
        0 3px 3px rgba(0,0,0,0.3);
}


/* =========================================================
   TEAM SEPARATION
   ========================================================= */

#homeTeam {
    border-right:
        2px solid rgba(0,0,0,0.55);
}


#awayTeam {
    border-left:
        2px solid rgba(0,0,0,0.55);
}


/* =========================================================
   GAMECAST LOGO
   ========================================================= */

#gamecastLogo {
    position: absolute;

    left: -4px;
    top: 5px;

    width: 96px;
    height: 27px;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 60;
}


#gamecastLogo img {
    width: 90px;
    max-height: 27px;

    object-fit: contain;
}


/* =========================================================
   POSSESSION ARROWS
   ========================================================= */

.possession {
    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 0;
    height: 0;

    z-index: 70;

    display: none;
}


/* HOME POSSESSION */

#homePossession {
    right: 2px;

    border-top:
        7px solid transparent;

    border-bottom:
        7px solid transparent;

    border-right:
        10px solid #ffffff;
}


/* AWAY POSSESSION */

#awayPossession {
    left: 2px;

    border-top:
        7px solid transparent;

    border-bottom:
        7px solid transparent;

    border-left:
        10px solid #ffffff;
}


/* =========================================================
   OPTIONAL RANKINGS
   ========================================================= */

.rank {
    position: absolute;

    z-index: 25;

    font-family:
        "Arial Black",
        Arial,
        sans-serif;

    font-size: 12px;

    font-weight: 900;

    color: #ffffff;

    opacity: 0.85;

    display: none;
}


#homeRank {
    left: 72px;
    top: 5px;
}


#awayRank {
    right: 72px;
    top: 5px;
}


/* =========================================================
   RESPONSIVE — 1600
   ========================================================= */

@media (max-width: 1600px) {

    #scoreboard {
        bottom: 22px;

        width: 700px;
        height: 98px;
    }


    #teamsRow {
        height: 66px;
    }


    #homeTeam,
    #awayTeam {
        width: 290px;
        height: 66px;
    }


    #homeTeam .teamLogo {
        left: -28px;
        top: -14px;

        width: 80px;
        height: 80px;
    }


    #awayTeam .teamLogo {
        right: -28px;
        top: -14px;

        width: 80px;
        height: 80px;
    }


    #homeName,
    #awayName {
        top: 16px;

        font-size: 19px;
    }


    #homeName {
        left: 60px;
    }


    #awayName {
        right: 60px;
    }


    #homeScore,
    #awayScore {
        font-size: 48px;
    }


    #homeScore {
        right: 11px;
    }


    #awayScore {
        left: 11px;
    }


    #infoBox {
        width: 210px;
        height: 66px;
    }


    #quarter {
        width: 58px;
        min-width: 58px;

        height: 66px;

        font-size: 16px;
    }


    #gameInfo {
        height: 66px;
    }


    #downDist {
        font-size: 14px;
    }


    #gamecastLogo {
        width: 82px;
    }


    #gamecastLogo img {
        width: 78px;
    }
}


/* =========================================================
   RESPONSIVE — 1100
   ========================================================= */

@media (max-width: 1100px) {

    #scoreboard {
        bottom: 15px;

        width: 560px;
        height: 82px;
    }


    #teamsRow {
        height: 55px;
    }


    #homeTeam,
    #awayTeam {
        width: 225px;
        height: 55px;
    }


    #homeTeam .teamLogo {
        left: -22px;
        top: -10px;

        width: 66px;
        height: 66px;
    }


    #awayTeam .teamLogo {
        right: -22px;
        top: -10px;

        width: 66px;
        height: 66px;
    }


    #homeName,
    #awayName {
        top: 14px;

        font-size: 14px;
    }


    #homeName {
        left: 46px;
    }


    #awayName {
        right: 46px;
    }


    #homeScore,
    #awayScore {
        font-size: 39px;
    }


    #homeScore {
        right: 8px;
    }


    #awayScore {
        left: 8px;
    }


    #infoBox {
        width: 165px;
        height: 55px;
    }


    #quarter {
        width: 45px;
        min-width: 45px;

        height: 55px;

        font-size: 13px;
    }


    #gameInfo {
        height: 55px;
    }


    #downDist {
        font-size: 11px;
    }


    #gamecastLogo {
        left: -2px;
        top: 3px;

        width: 70px;
    }


    #gamecastLogo img {
        width: 68px;
    }
}

</style>
</head>

<body>


<!-- =======================================================
     SCOREBUG
     ======================================================= -->

<div id="scoreboard">


    <!-- ===================================================
         TEAM ROW
         =================================================== -->

    <div id="teamsRow">

        <!-- HOME TEAM -->
        <div id="homeTeam">

            <img
                id="homeLogo"
                class="teamLogo"
                src="images/linsly-logo.png"
                alt="Home Logo"
            >

            <span id="homeName">
                HOME
            </span>

            <span id="homeScore">
                0
            </span>

            <div
                id="homePossession"
                class="possession"
            ></div>

        </div>


        <!-- CENTER -->
        <div id="infoBox">

            <div id="quarter">
                1ST
            </div>

            <div id="gameInfo">

                <div id="downDist">
                    1ST &amp; 10
                </div>

            </div>

        </div>


        <!-- AWAY TEAM -->
        <div id="awayTeam">

            <span id="awayScore">
                0
            </span>

            <span id="awayName">
                AWAY
            </span>

            <img
                id="awayLogo"
                class="teamLogo"
                src="https://resources.finalsite.net/images/f_auto,q_auto/v1659196747/panthercountryorg/bgf3cjasma9qhzw9wx74/Manchester.png"
                alt="Away Logo"
            >

            <div
                id="awayPossession"
                class="possession"
            ></div>

        </div>

    </div>

</div>


<!-- =======================================================
     FIREBASE
     ======================================================= -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDZjXZtfqEscgVBYOYDZS-vRwxBuXuVsbQ",

    authDomain:
        "email-list-83dfb.firebaseapp.com",

    projectId:
        "email-list-83dfb",

    storageBucket:
        "email-list-83dfb.firebasestorage.app",

    messagingSenderId:
        "471452404510",

    appId:
        "1:471452404510:web:e91752174f6f0000c1570f",

    measurementId:
        "G-3X5TK2WYBF"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);

const scoreboardRef =
    ref(db, "scoreboard");


onValue(scoreboardRef, (snapshot) => {

    const s = snapshot.val();

    if (!s) return;


    /* =========================================
       TEAM NAMES
       ========================================= */

    const homeNameEl = document.getElementById("homeName");
    if (homeNameEl) homeNameEl.textContent = s.home || "HOME";

    const awayNameEl = document.getElementById("awayName");
    if (awayNameEl) awayNameEl.textContent = s.away || "AWAY";


    /* =========================================
       SCORES
       ========================================= */

    const homeScoreEl = document.getElementById("homeScore");
    if (homeScoreEl) homeScoreEl.textContent = s.score?.home ?? 0;

    const awayScoreEl = document.getElementById("awayScore");
    if (awayScoreEl) awayScoreEl.textContent = s.score?.away ?? 0;


    /* =========================================
       QUARTER
       ========================================= */

    const quarter = Number(s.quarter ?? 1);
    const quarterText = getQuarterText(quarter);

    const quarterEl = document.getElementById("quarter");
    if (quarterEl) quarterEl.textContent = quarterText;


    /* =========================================
       DOWN / DISTANCE
       ========================================= */

    const down = Number(s.down ?? 1);
    const yards = Number(s.yards ?? 10);

    const downText = `${down}${getSuffix(down)}`;
    const distanceText = yards <= 1 ? "GOAL" : yards;
    const downDistance = `${downText} & ${distanceText}`;

    const downDistEl = document.getElementById("downDist");
    if (downDistEl) downDistEl.textContent = downDistance;

});


/* =========================================================
   QUARTER
   ========================================================= */

function getQuarterText(q) {

    switch (q) {

        case 1:
            return "1ST";

        case 2:
            return "2ND";

        case 3:
            return "3RD";

        case 4:
            return "4TH";

        default:
            return "OT";

    }

}


/* =========================================================
   DOWN SUFFIX
   ========================================================= */

function getSuffix(number) {

    if (
        number >= 11 &&
        number <= 13
    ) {
        return "TH";
    }


    switch (number % 10) {

        case 1:
            return "ST";

        case 2:
            return "ND";

        case 3:
            return "RD";

        default:
            return "TH";

    }

}

</script>

</body>
</html>
