<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling & Syllable Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #d97706;
            --secondary-hover: #b45309;
            --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --success: #10b981;
            --success-hover: #059669;
            --success-bg: #ecfdf5;
            --error: #ef4444;
            --error-bg: #fef2f2;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 {
            color: var(--text-main);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .progress-badge {
            display: inline-block;
            background: #e0e7ff;
            color: var(--primary);
            font-weight: 600;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 6px;
        }

        .section {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: all 0.25s ease;
            background-color: #fff;
            color: var(--text-main);
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        .toggle-peek {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-muted);
            opacity: 0.6;
            padding: 4px;
        }

        .toggle-peek:hover {
            opacity: 1;
        }

        input.correct {
            border-color: var(--success) !important;
            background-color: var(--success-bg) !important;
            color: #065f46 !important;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2) !important;
        }

        input.incorrect {
            border-color: var(--error) !important;
            background-color: var(--error-bg) !important;
            color: #991b1b !important;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2) !important;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        .nav-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-audio {
            flex: 1;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn-normal {
            background-color: var(--primary);
        }

        .btn-normal:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        .btn-slow {
            background-color: var(--secondary);
        }

        .btn-slow:hover:not(:disabled) {
            background-color: var(--secondary-hover);
        }

        .btn-submit {
            background-color: var(--success);
            color: white;
            width: 100%;
            margin-top: 10px;
            font-size: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn-submit:hover:not(:disabled) {
            background-color: var(--success-hover);
        }

        .btn-nav {
            background-color: #f3f4f6;
            color: var(--text-main);
            border: 1px solid var(--border);
            flex: 1;
        }

        .btn-nav:hover:not(:disabled) {
            background-color: #e5e7eb;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Spelling Practice</h2>
        <span class="progress-badge" id="progressCounter">Loading...</span>
    </div>

    <!-- Hidden Target Word Field -->
    <div class="section">
        <label for="targetWord">Current Word (Hidden):</label>
        <div class="input-wrapper">
            <input type="password" id="targetWord" readonly placeholder="Connecting to Firebase...">
            <button class="toggle-peek" id="btnPeek" title="Peek at Word"><i class="fa-solid fa-eye" id="peekIcon"></i></button>
        </div>
        <div class="nav-group">
            <button class="btn-nav" id="btnPrev" disabled><i class="fa-solid fa-arrow-left"></i> Prev</button>
            <button class="btn-nav" id="btnRandom" disabled><i class="fa-solid fa-dice"></i> Random</button>
            <button class="btn-nav" id="btnNext" disabled>Next <i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>

    <!-- Audio Speech Controls -->
    <div class="section">
        <label>Listen to the Word:</label>
        <div class="button-group">
            <button class="btn-audio btn-normal" id="btnRead" disabled><i class="fa-solid fa-volume-high"></i> Full Word</button>
            <button class="btn-audio btn-slow" id="btnSoundOut" disabled><i class="fa-solid fa-comments"></i> Syllables</button>
        </div>
    </div>

    <!-- User Guess Box & Submit Button -->
    <div class="section">
        <label for="userAttempt">Type what you hear:</label>
        <input type="text" id="userAttempt" placeholder="Type your spelling..." autocomplete="off" disabled>
        <button class="btn-submit" id="btnSubmit" disabled>Check Answer</button>
    </div>
</div>

<!-- Firebase Modular SDK & Application Logic -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCTg2zD5R8JBbifnPenLJZH39HqqEqvDWM",
        authDomain: "wordly-wise-18645.firebaseapp.com",
        projectId: "wordly-wise-18645",
        storageBucket: "wordly-wise-18645.firebasestorage.app",
        messagingSenderId: "444175168589",
        appId: "1:444175168589:web:a26ee100bda326a1501804",
        measurementId: "G-2QSK5LW01S"
    };

    // ElevenLabs API Configuration
    const ELEVENLABS_API_KEY = "sk_259bc2ab209bb0fe7f5ac840e2173d699e5d3a87c0eefc60";
    const VOICE_ID = "pNInz6obpgDQGcFmaJgB"; // Default Rachel voice ID

    // Feedback Sounds
    const correctAudio = new Audio('sounds/correct.mp3');
    const incorrectAudio = new Audio('sounds/incorrect.mp3');

    let wordList = [];
    let currentIndex = 0;
    let currentRawWord = "";
    let activeAudio = null;

    const targetInput = document.getElementById('targetWord');
    const userAttemptInput = document.getElementById('userAttempt');
    const progressCounter = document.getElementById('progressCounter');
    const btnPeek = document.getElementById('btnPeek');
    const peekIcon = document.getElementById('peekIcon');

    const btnRead = document.getElementById('btnRead');
    const btnSoundOut = document.getElementById('btnSoundOut');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnRandom = document.getElementById('btnRandom');

    function setControlsEnabled(enabled) {
        btnRead.disabled = !enabled;
        btnSoundOut.disabled = !enabled;
        btnSubmit.disabled = !enabled;
        btnPrev.disabled = !enabled;
        btnNext.disabled = !enabled;
        btnRandom.disabled = !enabled;
        userAttemptInput.disabled = !enabled;
    }

    function playCustomAudio(isCorrect) {
        if (isCorrect) {
            correctAudio.currentTime = 0;
            correctAudio.play().catch(e => console.log("Audio file missing or blocked:", e));
        } else {
            incorrectAudio.currentTime = 0;
            incorrectAudio.play().catch(e => console.log("Audio file missing or blocked:", e));
        }
    }

    async function loadWordsFromFirebase() {
        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const querySnapshot = await getDocs(collection(db, "spelling_words"));
            
            const fetchedWords = [];
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                if (data.word) {
                    fetchedWords.push(data.word.trim());
                }
            });

            if (fetchedWords.length > 0) {
                wordList = fetchedWords;
                setControlsEnabled(true);
                updateWordDisplay();
            } else {
                progressCounter.textContent = "No Words Found";
                targetInput.placeholder = "Add documents to 'spelling_words' collection.";
            }
        } catch (error) {
            console.error("Error fetching from Firebase:", error);
            progressCounter.textContent = "Connection Error";
            targetInput.placeholder = "Unable to fetch words from Firebase.";
        }
    }

    function updateWordDisplay() {
        if (wordList.length === 0) return;
        currentRawWord = wordList[currentIndex];
        targetInput.value = currentRawWord;
        targetInput.type = "password";
        peekIcon.className = "fa-solid fa-eye";
        progressCounter.textContent = `Word ${currentIndex + 1} of ${wordList.length}`;
        userAttemptInput.value = "";
        userAttemptInput.className = "";
    }

    function getSyllables(word) {
        word = word.toLowerCase();
        if (word.length <= 3) return [word];

        const syllableRegex = /[^aeiouy]*[aeiouy]+(?:[^aeiouy]*$|[^aeiouy](?=[^aeiouy]))?/gi;
        const matches = word.match(syllableRegex);
        return matches ? matches : [word];
    }

    async function speakWord(soundItOut) {
        if (!currentRawWord) return;

        if (activeAudio) {
            activeAudio.pause();
            activeAudio = null;
        }

        // Prepare text input safely
        let textToSay = currentRawWord.trim();
        if (soundItOut) {
            const syllables = getSyllables(currentRawWord);
            // Use hyphens or spaces instead of commas/ellipses
            textToSay = syllables.join(' - '); 
        }

        btnRead.disabled = true;
        btnSoundOut.disabled = true;

        try {
            const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
                method: "POST",
                headers: {
                    "Accept": "audio/mpeg",
                    "Content-Type": "application/json",
                    "xi-api-key": ELEVENLABS_API_KEY
                },
                body: JSON.stringify({
                    text: textToSay,
                    model_id: "eleven_turbo_v2_5",
                    voice_settings: {
                        stability: 0.5,
                        similarity_boost: 0.75
                    }
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                console.error("ElevenLabs Detailed Error:", JSON.stringify(errorData, null, 2));
                throw new Error(`API Request Failed with status: ${response.status}`);
            }

            const audioBlob = await response.blob();
            const audioUrl = URL.createObjectURL(audioBlob);
            
            activeAudio = new Audio(audioUrl);
            activeAudio.play();

            activeAudio.onended = () => {
                btnRead.disabled = false;
                btnSoundOut.disabled = false;
            };
        } catch (error) {
            console.error("ElevenLabs TTS Error:", error);
            btnRead.disabled = false;
            btnSoundOut.disabled = false;
            alert("Failed to play API audio. Check browser console for full error output.");
        }
    }

    function checkSpelling() {
        const target = currentRawWord.trim().toLowerCase();
        const userAttempt = userAttemptInput.value.trim().toLowerCase();

        if (userAttempt === "") {
            userAttemptInput.className = "";
            return;
        }

        if (userAttempt === target) {
            userAttemptInput.className = "correct";
            playCustomAudio(true);
        } else {
            userAttemptInput.className = "incorrect";
            playCustomAudio(false);
        }
    }

    btnPeek.addEventListener('click', () => {
        if (targetInput.type === "password") {
            targetInput.type = "text";
            peekIcon.className = "fa-solid fa-eye-slash";
        } else {
            targetInput.type = "password";
            peekIcon.className = "fa-solid fa-eye";
        }
    });

    btnRead.addEventListener('click', () => speakWord(false));
    btnSoundOut.addEventListener('click', () => speakWord(true));
    btnSubmit.addEventListener('click', checkSpelling);

    userAttemptInput.addEventListener('input', () => {
        userAttemptInput.className = "";
    });

    userAttemptInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            checkSpelling();
        }
    });

    btnNext.addEventListener('click', () => {
        if (wordList.length === 0) return;
        currentIndex = (currentIndex + 1) % wordList.length;
        updateWordDisplay();
    });

    btnPrev.addEventListener('click', () => {
        if (wordList.length === 0) return;
        currentIndex = (currentIndex - 1 + wordList.length) % wordList.length;
        updateWordDisplay();
    });

    btnRandom.addEventListener('click', () => {
        if (wordList.length === 0) return;
        let randomIndex;
        do {
            randomIndex = Math.floor(Math.random() * wordList.length);
        } while (randomIndex === currentIndex && wordList.length > 1);
        currentIndex = randomIndex;
        updateWordDisplay();
    });

    loadWordsFromFirebase();
</script>

</body>
</html>
