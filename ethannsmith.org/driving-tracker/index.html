<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS Fuel Tracker</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#1a73e8">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
/>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="map"></div>

<div class="dashboard">

    <div class="card">
    <div id="trackerStatus" class="status">
        <i class="fa-solid fa-eye"></i>
        Viewer Mode
    </div>
</div>

    <div class="card">
        <div class="label">Current Speed</div>
        <div id="speed" class="big">0 mph</div>
    </div>

    <div class="card">
        <div class="label">Max Speed</div>
        <div id="maxSpeed" class="big">0 mph</div>
    </div>

    <div class="card">
        <div class="label">Distance</div>
        <div id="distance" class="big">0.00 mi</div>
    </div>

    <div class="card">
    <button id="resetTrip">
        Reset Trip
    </button>

    

    <div class="card">

    <button id="startTrip">
        Start Trip
    </button>

</div>

<div class="card">

    <button id="stopTrip">
        Stop Trip
    </button>

    <button onclick="installApp()">Install App</button>

</div>
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
