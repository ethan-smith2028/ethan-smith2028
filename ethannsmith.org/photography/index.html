<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Beyond the Lens</title>
<link rel="icon" type="image/png" href="beyond-the-lens.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* =========================================================
   BEYOND THE LENS — MODERN PHOTOGRAPHY GALLERY
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap');

:root {
  --bg: #08090b;
  --surface: #101216;
  --surface-2: #15171c;
  --surface-3: #1b1e24;

  --text: #f5f7fa;
  --muted: #9298a3;
  --muted-2: #686e79;

  --border: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(255, 255, 255, 0.16);

  --accent: #ffffff;
  --green: #22c55e;

  --radius: 16px;
  --radius-lg: 22px;

  --shadow: 0 20px 60px rgba(0, 0, 0, .35);
}

/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;

  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  background:
    radial-gradient(
      circle at 50% -20%,
      rgba(255,255,255,.055),
      transparent 35%
    ),
    var(--bg);

  color: var(--text);

  -webkit-font-smoothing: antialiased;
}

img {
  max-width: 100%;
}

button,
select,
input {
  font: inherit;
}

/* =========================================================
   SCROLLBAR
   ========================================================= */

::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: #08090b;
}

::-webkit-scrollbar-thumb {
  background: #292d35;
  border-radius: 999px;
}

::-webkit-scrollbar-thumb:hover {
  background: #3a3f49;
}

/* =========================================================
   HERO
   ========================================================= */

.hero {
  position: relative;

  height: min(62vh, 620px);
  min-height: 380px;

  overflow: hidden;

  background: #050506;
}

.hero img {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  transform: scale(1.015);

  filter:
    saturate(.9)
    contrast(1.04);

  transition:
    opacity .5s ease,
    transform 1s cubic-bezier(.2,.8,.2,1);
}

.hero::before {
  content: "";

  position: absolute;
  inset: 0;

  z-index: 1;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.08) 0%,
      rgba(0,0,0,.08) 35%,
      rgba(0,0,0,.42) 65%,
      rgba(8,9,11,.98) 100%
    );
}

.hero::after {
  content: "";

  position: absolute;
  inset: 0;

  z-index: 1;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.32),
      transparent 45%,
      rgba(0,0,0,.18)
    );
}

.hero-title {
  position: absolute;

  left: clamp(24px, 5vw, 80px);
  bottom: clamp(36px, 6vw, 72px);

  z-index: 3;

  max-width: 900px;

  font-family: Manrope, Inter, sans-serif;

  font-size: clamp(2rem, 4.5vw, 4.5rem);
  line-height: 1.02;

  font-weight: 800;
  letter-spacing: -.055em;

  text-shadow:
    0 3px 20px rgba(0,0,0,.35);
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {
  position: sticky;

  top: 0;
  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 20px;

  min-height: 76px;

  padding: 12px clamp(18px, 4vw, 64px);

  background: rgba(8,9,11,.78);

  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);

  border-bottom: 1px solid var(--border);
}

.topbar::before {
  content: "";

  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;

  height: 1px;

  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.12),
    transparent
  );

  pointer-events: none;
}

.status {
  font-size: 13px;
  font-weight: 600;

  color: var(--muted);

  letter-spacing: .01em;
}

.topbar > div:last-child {
  display: flex;

  align-items: center;

  gap: 10px;

  flex-wrap: wrap;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.btn {
  appearance: none;

  border: 1px solid var(--border);

  border-radius: 11px;

  min-height: 42px;

  padding: 0 16px;

  background: rgba(255,255,255,.055);
  color: var(--text);

  font-size: 13px;
  font-weight: 700;

  letter-spacing: -.01em;

  cursor: pointer;

  transition:
    transform .2s ease,
    background .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.btn:hover {
  transform: translateY(-1px);

  background: rgba(255,255,255,.09);

  border-color: var(--border-hover);

  box-shadow:
    0 8px 24px rgba(0,0,0,.2);
}

.btn:active {
  transform: translateY(0);
}

.btn-primary {
  background: #f5f5f5;
  color: #0a0a0b;

  border-color: #f5f5f5;
}

.btn-primary:hover {
  background: #fff;
  color: #000;
}

.btn-green {
  background: var(--green);
  color: #031108;

  border-color: var(--green);

  box-shadow:
    0 8px 25px rgba(34,197,94,.12);
}

.btn-green:hover {
  background: #2dd36a;
  border-color: #2dd36a;
}

.btn-purple {
  background: #7c3aed;
  color: white;

  border-color: #7c3aed;
}

/* =========================================================
   GALLERY SELECT
   ========================================================= */

#gallerySelect {
  min-width: 230px;

  appearance: none;

  padding-right: 38px;

  background:
    linear-gradient(45deg, transparent 50%, #858b96 50%) calc(100% - 17px) 18px / 6px 6px no-repeat,
    linear-gradient(135deg, #858b96 50%, transparent 50%) calc(100% - 12px) 18px / 6px 6px no-repeat,
    rgba(255,255,255,.055);

  color: var(--text);
}

#gallerySelect option {
  background: #15171c;
  color: white;
}

/* =========================================================
   LOGIN PANEL
   ========================================================= */

.login-panel {
  display: none;

  padding: 20px clamp(18px, 4vw, 64px);

  background: #0e1014;

  border-bottom: 1px solid var(--border);
}

.login-panel input {
  width: 100%;

  padding: 13px 14px;

  margin-bottom: 10px;

  background: #090a0d;

  color: white;

  border: 1px solid var(--border);

  border-radius: 10px;

  outline: none;

  transition: border-color .2s ease;
}

.login-panel input:focus {
  border-color: rgba(255,255,255,.25);
}

/* =========================================================
   STATS
   ========================================================= */

.stats {
  display: grid;

  grid-template-columns:
    repeat(auto-fit, minmax(180px, 1fr));

  gap: 12px;

  max-width: 1500px;

  margin: 0 auto;

  padding: 28px clamp(18px, 4vw, 64px);
}

.stat {
  padding: 20px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.025)
    );

  border: 1px solid var(--border);

  border-radius: var(--radius);

  box-shadow:
    0 10px 30px rgba(0,0,0,.12);
}

.stat span {
  display: block;

  margin-bottom: 5px;

  font-family: Manrope, Inter, sans-serif;

  font-size: 30px;
  line-height: 1;

  font-weight: 800;

  letter-spacing: -.04em;
}

.stat small {
  color: var(--muted);

  font-size: 12px;
  font-weight: 600;
}

/* =========================================================
   GALLERY
   ========================================================= */

.gallery {
  width: min(1600px, 100%);

  margin: 0 auto;

  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 18px;

  padding:
    20px
    clamp(18px, 4vw, 64px)
    40px;
}

/* =========================================================
   PHOTO CARD
   ========================================================= */

.card {
  position: relative;

  overflow: hidden;

  background: var(--surface);

  border: 1px solid var(--border);

  border-radius: var(--radius);

  box-shadow:
    0 12px 35px rgba(0,0,0,.22);

  transition:
    transform .35s cubic-bezier(.2,.8,.2,1),
    border-color .35s ease,
    box-shadow .35s ease;
}

.card:hover {
  transform: translateY(-5px);

  border-color: var(--border-hover);

  box-shadow:
    0 25px 55px rgba(0,0,0,.4);
}

/* =========================================================
   IMAGE
   ========================================================= */

.img-wrapper {
  position: relative;

  width: 100%;

  aspect-ratio: 4 / 5;

  overflow: hidden;

  background: #0c0d10;

  cursor: zoom-in;
}

.img-wrapper::after {
  content: "";

  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      180deg,
      transparent 60%,
      rgba(0,0,0,.16)
    );

  pointer-events: none;

  opacity: 0;

  transition: opacity .3s ease;
}

.card:hover .img-wrapper::after {
  opacity: 1;
}

.img-wrapper img {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;

  user-select: none;
  -webkit-user-drag: none;

  transition:
    transform .65s cubic-bezier(.2,.8,.2,1),
    filter .4s ease;
}

.card:hover .img-wrapper img {
  transform: scale(1.045);

  filter: brightness(1.04);
}

/* =========================================================
   WATERMARK
   ========================================================= */

.watermark {
  position: absolute;

  inset: 0;

  pointer-events: none;

  overflow: hidden;

  opacity: .55;

  background:
    repeating-linear-gradient(
      -32deg,
      transparent 0,
      transparent 74px,
      rgba(255,255,255,.055) 74px,
      rgba(255,255,255,.055) 75px
    );
}

.watermark::after {
  content: "BEYOND THE LENS";

  position: absolute;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%)
    rotate(-30deg);

  width: 500px;

  text-align: center;

  font-family: Manrope, Inter, sans-serif;

  font-size: clamp(18px, 2vw, 28px);

  font-weight: 800;

  letter-spacing: 6px;

  white-space: nowrap;

  color: rgba(255,255,255,.16);
}

/* =========================================================
   ACTION AREA
   ========================================================= */

.actions {
  display: flex;

  align-items: center;

  padding: 10px;

  background:
    linear-gradient(
      180deg,
      #15171c,
      #111318
    );
}

.download {
  width: 100%;

  min-height: 40px;

  border: 1px solid rgba(255,255,255,.08);

  border-radius: 9px;

  background: rgba(255,255,255,.06);

  color: #f5f5f5;

  font-size: 12px;

  font-weight: 700;

  letter-spacing: .01em;

  cursor: pointer;

  transition:
    background .2s ease,
    border-color .2s ease,
    transform .2s ease;
}

.download:hover {
  background: rgba(255,255,255,.11);

  border-color: rgba(255,255,255,.15);

  transform: translateY(-1px);
}

.download:active {
  transform: translateY(0);
}

/* =========================================================
   LOAD MORE
   ========================================================= */

.load-more-container {
  display: flex;

  justify-content: center;

  padding:
    10px
    20px
    70px;
}

#loadMoreBtn {
  min-width: 170px;

  padding-left: 24px;
  padding-right: 24px;
}

/* =========================================================
   LIGHTBOX
   ========================================================= */

.lightbox {
  position: fixed;

  inset: 0;

  display: none;

  justify-content: center;
  align-items: center;

  padding: 30px;

  background: rgba(0,0,0,.94);

  backdrop-filter: blur(14px);

  z-index: 9999;

  cursor: zoom-out;

  animation: fadeIn .2s ease;
}

.lightbox img {
  max-width: 96vw;
  max-height: 92vh;

  object-fit: contain;

  border-radius: 8px;

  box-shadow:
    0 30px 100px rgba(0,0,0,.65);

  animation: lightboxIn .3s cubic-bezier(.2,.8,.2,1);
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

@keyframes lightboxIn {
  from {
    opacity: 0;
    transform: scale(.96);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* =========================================================
   DONATION FAB
   ========================================================= */

#donateFab {
  position: fixed;

  right: 28px;
  bottom: 28px;

  z-index: 99999;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 9px;

  min-height: 48px;

  padding: 0 18px;

  border: 1px solid rgba(255,255,255,.12);

  border-radius: 999px;

  background:
    rgba(20,21,25,.9);

  color: white;

  font-size: 13px;

  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 12px 35px rgba(0,0,0,.4);

  backdrop-filter: blur(16px);

  transition:
    transform .25s ease,
    background .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

#donateFab:hover {
  transform: translateY(-3px);

  background: #1b1d22;

  border-color: rgba(255,255,255,.2);

  box-shadow:
    0 18px 45px rgba(0,0,0,.5);
}

#donateFab .heart {
  font-size: 14px;

  line-height: 1;

  color: #ff5c69;
}

/* =========================================================
   DONATION PANEL
   ========================================================= */

#donationPanel {
  position: fixed;

  right: 28px;
  bottom: 90px;

  z-index: 99998;

  display: none;

  width: min(420px, calc(100vw - 32px));
  height: min(650px, calc(100vh - 120px));

  overflow: hidden;

  background: #fff;

  border: 1px solid rgba(255,255,255,.12);

  border-radius: 20px;

  box-shadow:
    0 30px 100px rgba(0,0,0,.55);

  animation: panelIn .25s cubic-bezier(.2,.8,.2,1);
}

@keyframes panelIn {
  from {
    opacity: 0;
    transform: translateY(12px) scale(.97);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.donationHeader {
  height: 58px;

  display: flex;

  align-items: center;
  justify-content: space-between;

  padding: 0 18px;

  background: #fff;

  color: #101114;

  font-size: 14px;

  font-weight: 800;

  border-bottom: 1px solid #e5e7eb;
}

.donationHeader button {
  display: grid;

  place-items: center;

  width: 32px;
  height: 32px;

  border: none;

  border-radius: 8px;

  background: #f1f2f4;

  color: #34363a;

  font-size: 15px;

  cursor: pointer;

  transition: background .2s ease;
}

.donationHeader button:hover {
  background: #e5e7eb;
}

#donationPanel iframe {
  width: 100%;
  height: calc(100% - 58px);

  border: none;
}

/* =========================================================
   MODAL
   ========================================================= */

.modal {
  position: fixed;

  inset: 0;

  z-index: 10000;

  display: none;

  justify-content: center;
  align-items: center;

  padding: 20px;

  background: rgba(0,0,0,.85);

  backdrop-filter: blur(12px);
}

.modal-content {
  position: relative;

  width: min(1000px, 100%);

  height: min(82vh, 800px);

  overflow: hidden;

  background: white;

  border: 1px solid rgba(255,255,255,.12);

  border-radius: 18px;

  box-shadow:
    0 40px 100px rgba(0,0,0,.55);
}

.modal iframe {
  width: 100%;
  height: 100%;

  border: none;
}

.close {
  position: absolute;

  top: 12px;
  right: 12px;

  z-index: 2;

  display: grid;

  place-items: center;

  width: 36px;
  height: 36px;

  border: 1px solid rgba(255,255,255,.1);

  border-radius: 50%;

  background: rgba(0,0,0,.75);

  color: white;

  font-size: 14px;

  cursor: pointer;

  backdrop-filter: blur(10px);

  transition:
    transform .2s ease,
    background .2s ease;
}

.close:hover {
  transform: scale(1.08);

  background: #000;
}

/* =========================================================
   RESPONSIVE — TABLET
   ========================================================= */

@media (max-width: 1200px) {

  .gallery {
    grid-template-columns:
      repeat(3, minmax(0, 1fr));
  }

}

/* =========================================================
   RESPONSIVE — SMALL TABLET
   ========================================================= */

@media (max-width: 900px) {

  .hero {
    height: 440px;
  }

  .gallery {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    gap: 14px;
  }

  .hero-title {
    max-width: 700px;
  }

}

/* =========================================================
   RESPONSIVE — MOBILE
   ========================================================= */

@media (max-width: 600px) {

  body {
    overflow-x: hidden;
  }

  /* HERO */

  .hero {
    height: 330px;
    min-height: 330px;
  }

  .hero::before {
    background:
      linear-gradient(
        180deg,
        rgba(0,0,0,.05),
        rgba(0,0,0,.18) 40%,
        rgba(8,9,11,1) 100%
      );
  }

  .hero-title {
    left: 18px;
    right: 18px;
    bottom: 30px;

    font-size: 2rem;

    line-height: 1.04;

    letter-spacing: -.045em;
  }

  /* TOP BAR */

  .topbar {
    align-items: stretch;

    flex-direction: column;

    gap: 10px;

    padding: 12px;
  }

  .status {
    display: none;
  }

  .topbar > div:last-child {
    width: 100%;

    display: grid;

    grid-template-columns: 1fr auto;

    gap: 8px;
  }

  #gallerySelect {
    width: 100%;

    min-width: 0;
  }

  #openBtn {
    padding-left: 14px;
    padding-right: 14px;
  }

  /* GALLERY */

  .gallery {
    grid-template-columns: 1fr;

    gap: 14px;

    padding:
      14px
      14px
      30px;
  }

  .card {
    border-radius: 14px;
  }

  .img-wrapper {
    aspect-ratio: 4 / 5;
  }

  /* BUTTONS */

  .btn {
    min-height: 40px;

    padding: 0 13px;

    font-size: 12px;
  }

  /* LOAD MORE */

  .load-more-container {
    padding:
      5px
      14px
      50px;
  }

  #loadMoreBtn {
    width: 100%;
    max-width: 360px;
  }

  /* LIGHTBOX */

  .lightbox {
    padding: 10px;
  }

  .lightbox img {
    max-width: 100%;
    max-height: 88vh;

    border-radius: 5px;
  }

  /* DONATION */

  #donateFab {
    right: 14px;
    bottom: 14px;

    min-height: 44px;

    padding: 0 15px;

    font-size: 12px;
  }

  #donationPanel {
    left: 8px;
    right: 8px;

    bottom: 70px;

    width: auto;

    height: calc(100vh - 90px);

    border-radius: 16px;
  }

  /* MODAL */

  .modal {
    padding: 8px;
  }

  .modal-content {
    height: 92vh;

    border-radius: 14px;
  }

}

/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 380px) {

  .hero {
    height: 300px;
  }

  .hero-title {
    font-size: 1.7rem;
  }

  .topbar > div:last-child {
    grid-template-columns: 1fr;
  }

  #openBtn {
    width: 100%;
  }

}

/* =========================================================
   LOADING SCREEN
   ========================================================= */

.loading-screen {
  position: fixed;
  inset: 0;
  z-index: 999999;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(255,255,255,.045),
      transparent 35%
    ),
    #08090b;

  opacity: 1;
  visibility: visible;

  transition:
    opacity .65s cubic-bezier(.2,.8,.2,1),
    visibility .65s ease;
}

.loading-screen.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loading-content {
  width: min(420px, calc(100vw - 48px));

  text-align: center;
}

.loading-brand {
  margin-bottom: 14px;

  font-family: Manrope, Inter, sans-serif;

  font-size: 14px;
  font-weight: 800;

  letter-spacing: .18em;

  color: #f5f7fa;
}

.loading-status {
  margin-bottom: 14px;

  color: #9298a3;

  font-size: 12px;
  font-weight: 600;

  letter-spacing: .01em;
}

.progress-track {
  position: relative;

  width: 100%;
  height: 4px;

  overflow: hidden;

  background: rgba(255,255,255,.08);

  border-radius: 999px;
}

.progress-bar {
  width: 0%;
  height: 100%;

  background: #f5f7fa;

  border-radius: inherit;

  box-shadow:
    0 0 18px rgba(255,255,255,.25);

  transition:
    width .25s cubic-bezier(.2,.8,.2,1);
}

.loading-percent {
  margin-top: 10px;

  color: #686e79;

  font-size: 11px;
  font-weight: 700;

  letter-spacing: .08em;
}

/* Prevent the page from showing underneath while loading */
body.is-loading {
  overflow: hidden;
}

/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
  }

}
</style>
</head>

<body>

  <!-- LOADING SCREEN -->

/* ================= LOADING SCREEN ================= */

const loadingScreen = document.getElementById("loadingScreen");
const progressBar = document.getElementById("progressBar");
const loadingPercent = document.getElementById("loadingPercent");
const loadingStatus = document.getElementById("loadingStatus");

document.body.classList.add("is-loading");

let loadingTotal = 0;
let loadingCompleted = 0;

function startLoading(total) {
  loadingTotal = Math.max(total, 1);
  loadingCompleted = 0;

  loadingScreen.classList.remove("hidden");

  progressBar.style.width = "0%";
  loadingPercent.textContent = "0%";
  loadingStatus.textContent = "Loading photos...";

  document.body.classList.add("is-loading");
}

function updateLoading() {
  loadingCompleted++;

  const percent = Math.min(
    100,
    Math.round((loadingCompleted / loadingTotal) * 100)
  );

  progressBar.style.width = `${percent}%`;
  loadingPercent.textContent = `${percent}%`;

  if (percent >= 100) {
    loadingStatus.textContent = "Ready";
  }
}

function finishLoading() {
  progressBar.style.width = "100%";
  loadingPercent.textContent = "100%";
  loadingStatus.textContent = "Ready";

  setTimeout(() => {
    loadingScreen.classList.add("hidden");
    document.body.classList.remove("is-loading");
  }, 350);
}

/* Load an image and report when it finishes */
function preloadImage(src) {
  return new Promise(resolve => {
    const img = new Image();

    img.onload = () => {
      updateLoading();
      resolve();
    };

    img.onerror = () => {
      // Don't let one broken image hold the entire page hostage
      updateLoading();
      resolve();
    };

    img.src = src;
  });
}

/* ================= GALLERIES ================= */
const GALLERIES = [
  {
    name: "WVSLA Linsly vs Morgantown",
    folderId: "1IZN4UlPhh8PHnQP5IHSzlq4xncvnWXP5",

  },
  {

  },

];

let activeGallery = 0;
let allFiles = [];
let currentIndex = 0;

const PAGE_SIZE = 24;

/* ================= ELEMENTS ================= */
const el = (id) => document.getElementById(id);

const status = el("status");
const gallerySelect = el("gallerySelect");
const heroImg = el("heroImg");

const gallery = el("gallery");

const donateFab = el("donateFab");

const closeDonation = el("closeDonation");

/* ================= HERO ================= */
GALLERIES.forEach((g, i) => {
  const opt = document.createElement("option");
  opt.value = i;
  opt.textContent = g.name;
  gallerySelect.appendChild(opt);
});

gallerySelect.onchange = async () => {
  activeGallery = Number(gallerySelect.value);

  updateHero();

  await loadGallery(true);
};

async function updateHero() {
  const g = GALLERIES[activeGallery];

  loadingStatus.textContent = "Loading gallery...";

  startLoading(1);

  heroImg.onload = () => {
    updateLoading();
    finishLoading();
  };

  heroImg.onerror = () => {
    updateLoading();
    finishLoading();
  };

  heroImg.src = g.hero;

  heroTitle.textContent = `${g.name} • ${g.date}`;
}

/* ================= DRIVE API ================= */
const API_KEY = "AIzaSyDsLv4fSrtWzohfpbuL0tVZHIhymmDyTPs";

async function fetchImages(folderId) {
  let pageToken = null;
  let files = [];

  do {
    const url =
      `https://www.googleapis.com/drive/v3/files` +
      `?q='${folderId}'+in+parents` +
      `&key=${API_KEY}` +
      `&pageSize=1000` +
      `&fields=nextPageToken,files(id,name,mimeType)` +
      (pageToken ? `&pageToken=${pageToken}` : "");

    const res = await fetch(url);
    const data = await res.json();

    if (data.error) break;

    files.push(...(data.files || []));
    pageToken = data.nextPageToken;
  } while (pageToken);

  return files.filter(f => f.mimeType?.startsWith("image/"));
}

/* ================= RENDER ================= */
async function loadGallery(reset = true) {
  loadMoreBtn.style.display = "none";

  if (reset) {
    gallery.innerHTML = "";
    currentIndex = 0;

    const g = GALLERIES[activeGallery];

    loadingStatus.textContent = "Finding photos...";
    startLoading(1);

    allFiles = await fetchImages(g.folderId);

    updateLoading();

    gallery.innerHTML = "";
  }

  if (!allFiles.length) {
    gallery.innerHTML =
      "<p style='opacity:.7;padding:20px'>No photos found.</p>";

    finishLoading();
    return;
  }

  const nextBatch = allFiles.slice(
    currentIndex,
    currentIndex + PAGE_SIZE
  );

  /*
   * Only preload the images we're actually about
   * to display. This keeps the loading screen fast
   * even when a gallery contains hundreds of photos.
   */
  startLoading(nextBatch.length);

  const imageUrls = nextBatch.map(
    file =>
      `https://lh3.googleusercontent.com/d/${file.id}=w1200`
  );

  /*
   * Start loading all images at the same time.
   * Each completed image updates the progress bar.
   */
  const imagePromises = imageUrls.map(preloadImage);

  nextBatch.forEach((file, index) => {
    const imgUrl = imageUrls[index];

    const downloadUrl =
      `https://drive.google.com/uc?export=download&id=${file.id}`;

    const card = document.createElement("div");
    card.className = "card";

    const wrap = document.createElement("div");
    wrap.className = "img-wrapper";

    const img = document.createElement("img");

    /*
     * The image was preloaded above, so it should
     * appear immediately when inserted.
     */
    img.src = imgUrl;

    img.onclick = () => {
      lightbox.style.display = "flex";
      lightboxImg.src = imgUrl;
    };

    const watermark = document.createElement("div");
    watermark.className = "watermark";

    wrap.appendChild(img);
    wrap.appendChild(watermark);

    const actions = document.createElement("div");
    actions.className = "actions";

    const btn = document.createElement("button");
    btn.className = "download";
    btn.textContent = "Download";

    btn.onclick = e => {
      e.preventDefault();
      e.stopPropagation();

      sessionStorage.setItem(
        "scrollPos",
        window.scrollY
      );

      sessionStorage.setItem(
        "activeGallery",
        activeGallery
      );

      sessionStorage.setItem(
        "currentIndex",
        currentIndex
      );

      location.href = downloadUrl;
    };

    actions.appendChild(btn);

    card.appendChild(wrap);
    card.appendChild(actions);

    gallery.appendChild(card);
  });

  /*
   * Wait until every visible image has finished loading.
   */
  await Promise.all(imagePromises);

  currentIndex += PAGE_SIZE;

  if (currentIndex < allFiles.length) {
    loadMoreBtn.style.display = "block";
  }

  finishLoading();
}

/* ================= RESTORE AFTER MOBILE DOWNLOAD ================= */
window.addEventListener("load", async () => {
  const savedGallery = sessionStorage.getItem("activeGallery");
  const savedIndex = sessionStorage.getItem("currentIndex");
  const savedScroll = sessionStorage.getItem("scrollPos");

  updateHero();

  if (savedGallery !== null) {
    activeGallery = Number(savedGallery);
    gallerySelect.value = activeGallery;

    const g = GALLERIES[activeGallery];
    allFiles = await fetchImages(g.folderId);

    gallery.innerHTML = "";
    currentIndex = 0;

    const target = Number(savedIndex || PAGE_SIZE);

    while (currentIndex < target) {
      await loadGallery(false);
    }

    requestAnimationFrame(() => {
      window.scrollTo(0, Number(savedScroll || 0));
    });
  }
});

/* ================= BUTTONS ================= */
loadMoreBtn.onclick = () => loadGallery(false);
document.getElementById("openBtn").onclick = () => loadGallery(true);

/* ================= LIGHTBOX ================= */
lightbox.onclick = () => {
  lightbox.style.display = "none";
};

/* ================= DONATION ================= */
donateFab.onclick = () => {
  donationPanel.style.display = "block";
};

closeDonation.onclick = () => {
  donationPanel.style.display = "none";
};

/* ================= INIT ================= */
updateHero();
</script>
