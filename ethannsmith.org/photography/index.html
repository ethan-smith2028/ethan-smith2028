<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Beyond the Lens</title>
<link rel="icon" type="image/png" href="beyond-the-lens.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* =========================
   GLOBAL
========================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, system-ui, Arial, sans-serif;
  background: #09090b;
  color: #fff;
  min-height: 100vh;
}

img {
  max-width: 100%;
}

button {
  font-family: inherit;
}

/* =========================
   HERO
========================= */

.hero {
  position: relative;
  height: 340px;
  overflow: hidden;
}

.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.85),
      rgba(0,0,0,.2)
    );
}

.hero-title {
  position: absolute;
  bottom: 24px;
  left: 24px;
  z-index: 2;

  font-size: 2rem;
  font-weight: 800;
  letter-spacing: -.03em;

  max-width: 700px;
}

/* =========================
   TOP BAR
========================= */

.topbar {
  position: sticky;
  top: 0;
  z-index: 100;

  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;

  padding: 14px 20px;

  background: rgba(17,24,39,.8);
  backdrop-filter: blur(18px);

  border-bottom: 1px solid rgba(255,255,255,.08);
}

.status {
  font-size: 14px;
  opacity: .75;
}

.topbar > div:last-child {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

/* =========================
   BUTTONS
========================= */

.btn {
  border: none;
  cursor: pointer;

  padding: 11px 16px;

  border-radius: 12px;

  font-size: 14px;
  font-weight: 600;

  transition: .2s ease;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn-primary {
  background: #2563eb;
  color: white;
}

.btn-green {
  background: #16a34a;
  color: white;
}

.btn-purple {
  background: #7c3aed;
  color: white;
}

/* =========================
   LOGIN PANEL
========================= */

.login-panel {
  display: none;

  background: #111827;

  padding: 18px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.login-panel input {
  width: 100%;

  padding: 12px;

  margin-bottom: 10px;

  border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px;

  background: #0f172a;
  color: white;
}

/* =========================
   STATS
========================= */

.stats {
  display: flex;
  gap: 16px;
  padding: 20px;
  flex-wrap: wrap;
}

.stat {
  background: #18181b;

  border-radius: 18px;

  min-width: 160px;

  padding: 18px;

  border: 1px solid rgba(255,255,255,.05);
}

.stat span {
  display: block;

  font-size: 28px;
  font-weight: 800;
}

/* =========================
   GALLERY GRID
========================= */

.gallery {
  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(260px, 1fr));

  gap: 18px;

  padding: 20px;
}

/* =========================
   CARD
========================= */

.card {
  background: #18181b;

  border-radius: 18px;

  overflow: hidden;

  border: 1px solid rgba(255,255,255,.05);

  transition: .25s ease;

  box-shadow:
    0 10px 30px rgba(0,0,0,.25);
}

.card:hover {
  transform: translateY(-4px);

  box-shadow:
    0 20px 45px rgba(0,0,0,.45);
}

.img-wrapper {
  position: relative;

  width: 100%;

  aspect-ratio: 3/4;

  overflow: hidden;
}

.img-wrapper img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;

  transition: transform .4s ease;

  user-select: none;
  -webkit-user-drag: none;
}

.card:hover .img-wrapper img {
  transform: scale(1.03);
}

/* =========================
   WATERMARK
========================= */

.watermark {
  position: absolute;
  inset: 0;

  pointer-events: none;

  background-image:
    repeating-linear-gradient(
      -30deg,
      rgba(255,255,255,.08) 0px,
      rgba(255,255,255,.08) 2px,
      transparent 2px,
      transparent 60px
    );
}

.watermark::after {
  content: "BEYOND THE LENS";

  position: absolute;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%)
    rotate(-30deg);

  font-size: 26px;
  font-weight: 900;
  letter-spacing: 4px;

  color: rgba(255,255,255,.35);
}

/* =========================
   IMAGE NUMBER
========================= */

.image-number {
  padding: 10px 14px;

  background: #0f172a;

  border-top: 1px solid rgba(255,255,255,.06);

  font-size: 13px;
  font-weight: 700;
}

/* =========================
   ACTIONS
========================= */

.actions {
  padding: 12px;
}

.download {
  width: 100%;

  border: none;

  border-radius: 10px;

  padding: 12px;

  cursor: pointer;

  font-weight: 700;

  background: #2563eb;
  color: white;

  transition: .2s ease;
}

.download:hover {
  background: #1d4ed8;
}

/* =========================
   LOAD MORE
========================= */

.load-more-container {
  display: flex;
  justify-content: center;
  padding: 20px 0 40px;
}

#loadMoreBtn {
  width: auto;
  min-width: 160px;
}

/* =========================
   LIGHTBOX
========================= */

.lightbox {
  position: fixed;

  inset: 0;

  display: none;
  justify-content: center;
  align-items: center;

  background: rgba(0,0,0,.95);

  z-index: 9999;
}

.lightbox img {
  max-width: 95%;
  max-height: 95%;
  border-radius: 12px;
}

/* =========================
   DONATION FAB
========================= */

#donateFab {
  position: fixed;
  right: 24px;
  bottom: 24px;

  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 8px;

  padding: 12px 18px;

  background: #ef4444;
  color: white;

  border: none;
  border-radius: 999px;

  font-size: 20px;
  font-weight: 700;

  cursor: pointer;
  z-index: 99999;

  box-shadow: 0 12px 30px rgba(239,68,68,.4);
  transition: .2s ease;
}

#donateFab .heart {
  font-size: 16px;
  line-height: 1;
}


#donateFab:hover {
  transform: scale(1.08);
}

/* =========================
   DONATION PANEL
========================= */

#donationPanel {
  position: fixed;

  right: 24px;
  bottom: 105px;

  width: 420px;
  height: 620px;

  background: white;

  border-radius: 22px;

  overflow: hidden;

  display: none;

  z-index: 99998;

  box-shadow:
    0 30px 80px rgba(0,0,0,.45);
}

.donationHeader {
  height: 56px;

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 0 18px;

  color: black;

  font-weight: 700;

  border-bottom: 1px solid #e5e7eb;
}

.donationHeader button {
  border: none;
  background: none;

  font-size: 18px;

  cursor: pointer;
}

#donationPanel iframe {
  width: 100%;
  height: calc(100% - 56px);

  border: none;
}

/* =========================
   ORIGINAL MODAL
========================= */

.modal {
  position: fixed;

  inset: 0;

  background: rgba(0,0,0,.8);

  display: none;

  justify-content: center;
  align-items: center;

  z-index: 1000;
}

.modal-content {
  width: 95%;
  max-width: 900px;

  height: 80vh;

  background: white;

  border-radius: 16px;

  overflow: hidden;

  position: relative;
}

.modal iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.close {
  position: absolute;

  right: 10px;
  top: 10px;

  width: 34px;
  height: 34px;

  border: none;
  border-radius: 50%;

  background: black;
  color: white;

  cursor: pointer;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

  /* ================= HERO ================= */
  .hero {
    height: 220px;
  }

  .hero-title {
    font-size: 1.1rem;
    left: 16px;
    right: 16px;
    bottom: 16px;
  }

  /* ================= TOP BAR ================= */
  .topbar {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 12px;
  }

  .topbar > div:last-child {
    width: 100%;
    justify-content: space-between;
  }

  select.btn {
    width: 100%;
  }

  /* ================= BUTTONS ================= */
  .btn {
    flex: 1;
    font-size: 13px;
    padding: 10px 12px;
  }

  /* ================= STATS (if used) ================= */
  .stats {
    padding: 12px;
    gap: 10px;
  }

  .stat {
    flex: 1;
    min-width: unset;
    padding: 14px;
  }

  .stat span {
    font-size: 22px;
  }

  /* ================= GALLERY ================= */
  .gallery {
    grid-template-columns: 1fr;
    padding: 12px;
    gap: 14px;
  }

  .card {
    border-radius: 14px;
  }

  /* ================= LIGHTBOX ================= */
  .lightbox img {
    max-width: 100%;
    max-height: 85%;
  }

  /* ================= DONATE BUTTON ================= */
  #donateFab {
    right: 14px;
    bottom: 14px;

    padding: 10px 14px;
    font-size: 16px;

    border-radius: 999px;
  }

  #donateFab .heart {
    font-size: 14px;
  }

  /* ================= DONATION PANEL ================= */
  #donationPanel {
    left: 10px;
    right: 10px;
    bottom: 80px;

    width: auto;
    height: 70vh;

    border-radius: 16px;
  }

  .donationHeader {
    font-size: 14px;
    padding: 0 12px;
  }

  /* ================= LOAD MORE ================= */
  .load-more-container {
    padding: 10px 0 30px;
  }

  #loadMoreBtn {
    width: 100%;
    max-width: 300px;
  }
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero" id="hero">
  <img id="heroImg" src="https://stadiumconnection.com/simages/2555.jpg">
  <div class="hero-title" id="heroTitle">
    WVSLA Linsly vs. Morgantown • 5/16/2026
  </div>
</div>

<!-- TOP BAR -->
<div class="topbar">

  <div class="status" ></div>

  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <select id="gallerySelect" class="btn"></select>

    <!--<button class="btn btn-primary" id="loginBtn">Sign In</button> 
    <button class="btn btn-purple" id="purchaseBtn">Purchase Access</button> -->
    <button class="btn btn-green" id="openBtn">Load Gallery</button>
  </div>

</div>

<!-- GALLERY -->
<div class="gallery" id="gallery"></div>

<div class="load-more-container">
  <button id="loadMoreBtn" class="btn btn-primary">Load More</button>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <img id="lightboxImg">
</div>

<!-- PURCHASE MODAL (UNCHANGED) -->
<div class="modal" id="modal">
  <div class="modal-content">
    <button class="close" id="close">✕</button>
    <iframe src="https://tally.so/r/PdkvPd"></iframe>
  </div>
</div>

<!-- DONATION FLOAT BUTTON -->
<button id="donateFab">
  <span class="heart">❤</span>
  <span>Donate</span>
</button>

<!-- DONATION PANEL -->
<div id="donationPanel">
  <div class="donationHeader">
    Support Beyond The Lens
    <button id="closeDonation">✕</button>
  </div>
  <iframe src="https://tally.so/r/PdkvPd"></iframe>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyDZjXZtfqEscgVBYOYDZS-vRwxBuXuVsbQ",
  authDomain: "email-list-83dfb.firebaseapp.com",
  databaseURL: "https://email-list-83dfb-default-rtdb.firebaseio.com",
  projectId: "email-list-83dfb",
  storageBucket: "email-list-83dfb.firebasestorage.app",
  messagingSenderId: "471452404510",
  appId: "1:471452404510:web:e91752174f6f0000c1570f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* ================= GALLERIES ================= */
const GALLERIES = [
  {
    name: "WVSLA Linsly vs Morgantown",
    folderId: "1IZN4UlPhh8PHnQP5IHSzlq4xncvnWXP5",
    hero: "https://stadiumconnection.com/simages/2555.jpg",
    date: "5/16/2026"
  },
  {
    name: "Seattle Selects Spring Classic Game 1",
    folderId: "1Vt-9N1L5KrLQRUbzmkwWip87FXxtpdix",
    hero: "https://www.seevirtual360.com/photos/tours/337989.jpg",
    date: "5/29/2026"
  }
];

let activeGallery = 0;
let allFiles = [];
let currentIndex = 0;

const PAGE_SIZE = 24;

/* ================= ELEMENTS ================= */
const el = (id) => document.getElementById(id);

const status = el("status");
const gallerySelect = el("gallerySelect");
const heroImg = el("heroImg");
const heroTitle = el("heroTitle");

const gallery = el("gallery");
const loadMoreBtn = el("loadMoreBtn");
const modal = el("modal");
const closeBtn = el("close");
const lightbox = el("lightbox");
const lightboxImg = el("lightboxImg");

const donateFab = el("donateFab");
const donationPanel = el("donationPanel");
const closeDonation = el("closeDonation");

/* ================= HERO ================= */
GALLERIES.forEach((g, i) => {
  const opt = document.createElement("option");
  opt.value = i;
  opt.textContent = g.name;
  gallerySelect.appendChild(opt);
});

gallerySelect.onchange = () => {
  activeGallery = Number(gallerySelect.value);
  updateHero();
};

function updateHero() {
  const g = GALLERIES[activeGallery];
  heroImg.src = g.hero;
  heroTitle.textContent = `${g.name} • ${g.date}`;
}

/* ================= DRIVE API ================= */
const API_KEY = "AIzaSyDsLv4fSrtWzohfpbuL0tVZHIhymmDyTPs";

async function fetchImages(folderId) {
  let pageToken = null;
  let files = [];

  do {
    const url =
      `https://www.googleapis.com/drive/v3/files` +
      `?q='${folderId}'+in+parents` +
      `&key=${API_KEY}` +
      `&pageSize=1000` +
      `&fields=nextPageToken,files(id,name,mimeType)` +
      (pageToken ? `&pageToken=${pageToken}` : "");

    const res = await fetch(url);
    const data = await res.json();

    if (data.error) break;

    files.push(...(data.files || []));
    pageToken = data.nextPageToken;
  } while (pageToken);

  return files.filter(f => f.mimeType?.startsWith("image/"));
}

/* ================= RENDER ================= */
async function loadGallery(reset = true) {
  loadMoreBtn.style.display = "none";

  if (reset) {
    gallery.innerHTML = "Loading...";
    currentIndex = 0;

    const g = GALLERIES[activeGallery];
    allFiles = await fetchImages(g.folderId);

    gallery.innerHTML = "";
  }

  if (!allFiles.length) {
    gallery.innerHTML = "<p style='opacity:.7;padding:20px'>No photos found.</p>";
    return;
  }

  const nextBatch = allFiles.slice(currentIndex, currentIndex + PAGE_SIZE);

  nextBatch.forEach(file => {
    const imgUrl = `https://lh3.googleusercontent.com/d/${file.id}=w1200`;
    const downloadUrl = `https://drive.google.com/uc?export=download&id=${file.id}`;

    const card = document.createElement("div");
    card.className = "card";

    const wrap = document.createElement("div");
    wrap.className = "img-wrapper";

    const img = document.createElement("img");
    img.src = imgUrl;

    img.onclick = () => {
      lightbox.style.display = "flex";
      lightboxImg.src = imgUrl;
    };

    const watermark = document.createElement("div");
    watermark.className = "watermark";

    wrap.appendChild(img);
    wrap.appendChild(watermark);

    const actions = document.createElement("div");
    actions.className = "actions";

    const btn = document.createElement("button");
    btn.className = "download";
    btn.textContent = "Download";

    btn.onclick = (e) => {
      e.preventDefault();
      e.stopPropagation();

      // SAVE STATE BEFORE NAVIGATING AWAY
      sessionStorage.setItem("scrollPos", window.scrollY);
      sessionStorage.setItem("activeGallery", activeGallery);
      sessionStorage.setItem("currentIndex", currentIndex);

      // IMPORTANT: direct navigation works better on mobile than window.open
      location.href = downloadUrl;
    };

    actions.appendChild(btn);
    card.appendChild(wrap);
    card.appendChild(actions);
    gallery.appendChild(card);
  });

  currentIndex += PAGE_SIZE;

  if (currentIndex < allFiles.length) {
    loadMoreBtn.style.display = "block";
  }
}

/* ================= RESTORE AFTER MOBILE DOWNLOAD ================= */
window.addEventListener("load", async () => {
  const savedGallery = sessionStorage.getItem("activeGallery");
  const savedIndex = sessionStorage.getItem("currentIndex");
  const savedScroll = sessionStorage.getItem("scrollPos");

  updateHero();

  if (savedGallery !== null) {
    activeGallery = Number(savedGallery);
    gallerySelect.value = activeGallery;

    const g = GALLERIES[activeGallery];
    allFiles = await fetchImages(g.folderId);

    gallery.innerHTML = "";
    currentIndex = 0;

    const target = Number(savedIndex || PAGE_SIZE);

    while (currentIndex < target) {
      await loadGallery(false);
    }

    requestAnimationFrame(() => {
      window.scrollTo(0, Number(savedScroll || 0));
    });
  }
});

/* ================= BUTTONS ================= */
loadMoreBtn.onclick = () => loadGallery(false);
document.getElementById("openBtn").onclick = () => loadGallery(true);

/* ================= LIGHTBOX ================= */
lightbox.onclick = () => {
  lightbox.style.display = "none";
};

/* ================= DONATION ================= */
donateFab.onclick = () => {
  donationPanel.style.display = "block";
};

closeDonation.onclick = () => {
  donationPanel.style.display = "none";
};

/* ================= INIT ================= */
updateHero();
</script>

</body>
</html>
