<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Beyond the Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: system-ui, Arial;
  background: #0b0f19;
  color: white;
}

/* HERO */
.hero {
  position: relative;
  height: 220px;
  overflow: hidden;
}

.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.6);
}

.hero-title {
  position: absolute;
  bottom: 12px;
  left: 14px;
  font-size: 18px;
  font-weight: 600;
  padding-right: 12px;
}

/* TOPBAR */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 12px 14px;
  background: #111827;
  position: sticky;
  top: 0;
  z-index: 10;
}

.status {
  font-size: 13px;
  opacity: 0.8;
  flex: 1 1 100%;
}

.topbar > div {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* BUTTONS */
.btn {
  border: none;
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 500;
  font-size: 14px;
}

.btn-primary { background: #2563eb; color: white; }
.btn-green { background: #16a34a; color: white; }
.btn-purple { background: #7c3aed; color: white; }

/* LOGIN */
.login-panel {
  display: none;
  background: #111827;
  padding: 12px;
}

.login-panel input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  margin-bottom: 8px;
}

/* GALLERY (DESKTOP DEFAULT) */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
  padding: 16px;
}

/* CARD */
.card {
  background: #111827;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.img-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4; /* desktop default */
  overflow: hidden;
}

@media (max-width: 768px) {
  .img-wrapper {
    aspect-ratio: 2 / 3; /* taller on mobile */
  }
}

.img-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* WATERMARK NOW MATCHES IMAGE ONLY */
.watermark {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;

  background-image: repeating-linear-gradient(
    -30deg,
    rgba(255, 255, 255, 0.12) 0px,
    rgba(255,255,255,0.12) 2px,
    transparent 2px,
    transparent 60px
  );
}

.watermark::after {
  content: "BEYOND THE LENS";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-30deg);

  font-size: 28px;
  font-weight: 900;
  letter-spacing: 4px;
  color: rgba(255,255,255,0.45);
}

/* ACTIONS */
.actions {
  display: flex;
  padding: 10px;
}

.download {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #2563eb;
  color: white;
}

/* IMAGE NUMBER */
.image-number {
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 700;
  background: #0f172a;
  border-top: 1px solid rgba(255,255,255,0.08);
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: none;
  align-items: center;
  justify-content: center;
}

.modal-content {
  width: 95%;
  height: 80vh;
  background: white;
  border-radius: 12px;
  position: relative;
}

.modal iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.close {
  position: absolute;
  right: 10px;
  top: 10px;
  background: black;
  color: white;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  border: none;
}

/* 📱 MOBILE */
@media (max-width: 768px) {

  .hero {
    height: 160px;
  }

  .hero-title {
    font-size: 15px;
  }

  .gallery {
    grid-template-columns: 1fr;
    padding: 10px;
  }

  .card img {
    height: 960px;
  }

  .btn {
    flex: 1;
    text-align: center;
  }

  .topbar {
    align-items: flex-start;
  }
}

.img-wrapper img {
  -webkit-touch-callout: none; /* iOS long press menu */
  -webkit-user-select: none;
  user-select: none;
  -webkit-user-drag: none;
}
</style>
</head>

<body>

<div class="hero">
  <img src="https://stadiumconnection.com/simages/2555.jpg">
  <div class="hero-title">WVSLA Linsly vs. Morgantown • 5/16/2026</div>
</div>

<div class="topbar">
  <div class="status" id="status">Not signed in</div>

  <div>
    <button class="btn btn-primary" id="loginBtn">Sign In</button>
    <button class="btn btn-purple" id="purchaseBtn">Purchase Access</button>
    <button class="btn btn-green" id="openBtn">Open Gallery</button>
  </div>
</div>

<div class="login-panel" id="loginPanel">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button class="btn btn-primary" id="signInBtn">Sign In</button>
</div>

<div class="gallery" id="gallery"></div>
<div style="text-align:center; padding: 20px;">
  <button id="loadMoreBtn" class="btn btn-primary" style="display:none;">
    Load More
  </button>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <button class="close" id="close">✕</button>
    <iframe src="https://tally.so/r/eq0gbx"></iframe>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ---------------- FIREBASE ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyDZjXZtfqEscgVBYOYDZS-vRwxBuXuVsbQ",
  authDomain: "email-list-83dfb.firebaseapp.com",
  databaseURL: "https://email-list-83dfb-default-rtdb.firebaseio.com",
  projectId: "email-list-83dfb",
  storageBucket: "email-list-83dfb.firebasestorage.app",
  messagingSenderId: "471452404510",
  appId: "1:471452404510:web:e91752174f6f0000c1570f",
  measurementId: "G-3X5TK2WYBF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* ---------------- AUTH STATE ---------------- */
onAuthStateChanged(auth, user => {
  status.textContent = user
    ? `Signed in: ${user.email}`
    : "Not signed in";
});

/* ---------------- ELEMENTS ---------------- */
const status = document.getElementById("status");
const loginBtn = document.getElementById("loginBtn");
const loginPanel = document.getElementById("loginPanel");

const email = document.getElementById("email");
const password = document.getElementById("password");
const signInBtn = document.getElementById("signInBtn");

const gallery = document.getElementById("gallery");

const modal = document.getElementById("modal");
const purchaseBtn = document.getElementById("purchaseBtn");
const closeBtn = document.getElementById("close");

const openBtn = document.getElementById("openBtn");
const loadMoreBtn = document.getElementById("loadMoreBtn");

/* ---------------- BASIC PROTECTION ---------------- */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());

const flash = document.createElement("div");
flash.style.position = "fixed";
flash.style.inset = "0";
flash.style.background = "white";
flash.style.opacity = "0";
flash.style.pointerEvents = "none";
flash.style.zIndex = "999999999";
flash.style.transition = "opacity 0.08s ease";
document.body.appendChild(flash);

let ctrlHeld = false;
let cmdHeld = false;

function updateFlash() {
  flash.style.opacity = (ctrlHeld || cmdHeld) ? "1" : "0";
}

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey) ctrlHeld = true;
  if (e.metaKey) cmdHeld = true;

  updateFlash();

  if (e.key === "F12") e.preventDefault();

  if (e.ctrlKey || e.metaKey) {
    const blocked = ["u", "s", "p", "c", "v", "x", "a", "i", "j"];
    if (blocked.includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
  }
});

document.addEventListener("keyup", () => {
  ctrlHeld = false;
  cmdHeld = false;
  updateFlash();
});

window.addEventListener("blur", () => {
  ctrlHeld = false;
  cmdHeld = false;
  updateFlash();
});

/* ---------------- LOGIN ---------------- */
loginBtn.onclick = () => {
  loginPanel.style.display =
    loginPanel.style.display === "block" ? "none" : "block";
};

signInBtn.onclick = async () => {
  try {
    await signInWithEmailAndPassword(auth, email.value, password.value);
  } catch (err) {
    alert(err.message);
  }
};

/* ---------------- GOOGLE DRIVE ---------------- */
const API_KEY = "AIzaSyDsLv4fSrtWzohfpbuL0tVZHIhymmDyTPs";
const FOLDER_ID = "1IZN4UlPhh8PHnQP5IHSzlq4xncvnWXP5";

async function fetchAllImages() {
  let pageToken = null;
  let files = [];

  do {
    const url =
      `https://www.googleapis.com/drive/v3/files` +
      `?q='${FOLDER_ID}'+in+parents+and mimeType contains 'image/'` +
      `&key=${API_KEY}` +
      `&pageSize=100` +
      (pageToken ? `&pageToken=${pageToken}` : "") +
      `&fields=nextPageToken,files(id,name)`;

    const res = await fetch(url);
    const data = await res.json();

    if (data.files) files.push(...data.files);
    pageToken = data.nextPageToken;
  } while (pageToken);

  return files;
}

/* ---------------- RENDER SYSTEM ---------------- */
let allFiles = [];
let currentIndex = 0;
const PAGE_SIZE = 12;

function renderNextBatch() {
  const slice = allFiles.slice(currentIndex, currentIndex + PAGE_SIZE);

  slice.forEach((file, index) => {
    const imageNumber = currentIndex + index + 1;

    const imgUrl = `https://lh3.googleusercontent.com/d/${file.id}=w1200`;
    const downloadUrl = `https://drive.google.com/uc?export=download&id=${file.id}`;

    const card = document.createElement("div");
    card.className = "card";

    /* ---------------- IMAGE WRAPPER (IMPORTANT FIX) ---------------- */
    const imgWrap = document.createElement("div");
    imgWrap.style.position = "relative";
    imgWrap.style.width = "100%";
    imgWrap.classList.add("img-wrapper");
    imgWrap.style.overflow = "hidden";

    const img = document.createElement("img");
    img.src = imgUrl;
    img.draggable = false;
    img.style.width = "100%";
    img.style.height = "100%";
    img.style.objectFit = "cover";
    img.style.display = "block";

    /* ---------------- WATERMARK (NOW PERFECTLY OVER IMAGE) ---------------- */
    const watermark = document.createElement("div");
    watermark.className = "watermark";
    watermark.style.position = "absolute";
    watermark.style.inset = "0";

    const numberTag = document.createElement("div");
    numberTag.className = "image-number";
    numberTag.textContent = `IMG-${String(imageNumber).padStart(4, "0")}`;

    const actions = document.createElement("div");
    actions.className = "actions";

    const btn = document.createElement("button");
    btn.className = "download";
    btn.textContent = "Download";

    btn.onclick = () =>
      requireLogin(() => window.open(downloadUrl, "_blank"));

    actions.appendChild(btn);

    /* ---------------- BUILD CARD ORDER ---------------- */
    imgWrap.appendChild(img);
    imgWrap.appendChild(watermark);

    card.appendChild(imgWrap);
    card.appendChild(numberTag);
    card.appendChild(actions);

    gallery.appendChild(card);
  });

  currentIndex += PAGE_SIZE;

  loadMoreBtn.style.display =
    currentIndex >= allFiles.length ? "none" : "inline-block";
}

/* ---------------- GALLERY ---------------- */
openBtn.onclick = async () => {
  gallery.innerHTML = "Loading...";
  loadMoreBtn.style.display = "none";

  allFiles = await fetchAllImages();
  allFiles.sort((a, b) => a.name.localeCompare(b.name));

  if (!allFiles.length) {
    gallery.innerHTML = "No images found.";
    return;
  }

  gallery.innerHTML = "";
  currentIndex = 0;

  renderNextBatch();
};

loadMoreBtn.onclick = renderNextBatch;

/* ---------------- MODAL ---------------- */
purchaseBtn.onclick = () => {
  modal.style.display = "flex";
};

closeBtn.onclick = () => {
  modal.style.display = "none";
};

window.onclick = (e) => {
  if (e.target === modal) modal.style.display = "none";
};

/* ---------------- LOGIN HELPER ---------------- */
function requireLogin(action) {
  if (!auth.currentUser) {
    alert("Please sign in first.");
    loginPanel.style.display = "block";
    return;
  }
  action();
}

document.addEventListener("visibilitychange", () => {
  document.body.style.filter =
    document.hidden ? "blur(20px)" : "none";
});
</script>

</body>
</html>
